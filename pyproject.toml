[build-system]
requires = [
    "setuptools>=68",
    "wheel"
]
build-backend = "setuptools.build_meta"


[project]
name = "innovation-os"

version = "0.1.0"

description = "Innovation intelligence operating system"

requires-python = ">=3.11"

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]


[tool.pytest.ini_options]

pythonpath = [
    "."
]

testpaths = [
    "tests"
]


[tool.setuptools.packages.find]

where = [
    "src"
]
